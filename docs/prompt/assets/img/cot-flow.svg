<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2E75B6"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="60" y="62" font-size="34" font-weight="700" fill="#1F4E79">思维链（CoT）：让模型“先想再做”</text>
  <text x="60" y="96" font-size="18" fill="#5a6672">复杂推理题加上“一步步思考”，准确率显著优于直接要答案。</text>

  <!-- boxes -->
  <rect x="60" y="170" width="240" height="120" rx="14" fill="#EAF2FB" stroke="#BDD7EE"/>
  <text x="180" y="222" font-size="22" font-weight="700" fill="#1F4E79" text-anchor="middle">问题 Question</text>
  <text x="180" y="256" font-size="15" fill="#5a6672" text-anchor="middle">小明有 12 颗糖…</text>

  <rect x="370" y="170" width="240" height="120" rx="14" fill="#EAF7EE" stroke="#2E8B57" stroke-opacity="0.4"/>
  <text x="490" y="222" font-size="22" font-weight="700" fill="#2E8B57" text-anchor="middle">提示“逐步思考”</text>
  <text x="490" y="256" font-size="15" fill="#5a6672" text-anchor="middle">Let's think step by step</text>

  <rect x="680" y="170" width="240" height="120" rx="14" fill="#FFF4E5" stroke="#C77700" stroke-opacity="0.4"/>
  <text x="800" y="222" font-size="22" font-weight="700" fill="#C77700" text-anchor="middle">中间推理</text>
  <text x="800" y="256" font-size="15" fill="#5a6672" text-anchor="middle">分步推导过程</text>

  <rect x="980" y="170" width="160" height="120" rx="14" fill="#1F4E79"/>
  <text x="1060" y="222" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">答案</text>
  <text x="1060" y="256" font-size="15" fill="#cfe0f2" text-anchor="middle">最终结论</text>

  <!-- arrows -->
  <line x1="300" y1="230" x2="366" y2="230" stroke="#2E75B6" stroke-width="3" marker-end="url(#a2)"/>
  <line x1="610" y1="230" x2="676" y2="230" stroke="#2E75B6" stroke-width="3" marker-end="url(#a2)"/>
  <line x1="920" y1="230" x2="976" y2="230" stroke="#2E75B6" stroke-width="3" marker-end="url(#a2)"/>

  <!-- zero-shot compare -->
  <text x="60" y="380" font-size="20" font-weight="700" fill="#5a6672">对比：直接要答案</text>
  <rect x="60" y="400" width="520" height="100" rx="12" fill="#f6f9fd" stroke="#e6ebf2"/>
  <text x="320" y="440" font-size="16" fill="#5a6672" text-anchor="middle">问题 → 直接答案</text>
  <text x="320" y="472" font-size="14" fill="#9dabba" text-anchor="middle">跳步推理，易算错、不可解释</text>

  <text x="620" y="380" font-size="20" font-weight="700" fill="#5a6672">加上 CoT 后</text>
  <rect x="620" y="400" width="520" height="100" rx="12" fill="#EAF7EE" stroke="#2E8B57" stroke-opacity="0.4"/>
  <text x="880" y="440" font-size="16" fill="#2E8B57" text-anchor="middle">问题 → 分步推理 → 答案</text>
  <text x="880" y="472" font-size="14" fill="#5a6672" text-anchor="middle">过程可检查，结果更可靠</text>
</svg>
